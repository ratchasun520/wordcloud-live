<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Cloud Psycho-CU</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/motion.css">
</head>
<body>
<div class="wrap">
  <main class="landing">
    <div class="landing-copy">
      <div class="brand rise" style="--i:0">
        <svg class="brand-mark" viewBox="0 0 26 26" aria-hidden="true"><circle cx="9" cy="14" r="7" fill="var(--w1)"/><circle cx="17" cy="11" r="6" fill="var(--w2)" opacity=".85"/><circle cx="18" cy="18" r="4" fill="var(--w3)" opacity=".85"/></svg>
        <span>Word Cloud Psycho-CU</span>
      </div>
      <h1 class="hero-title">
        <span class="line rise" style="--i:1">ระดมความคิดเรื่อง</span>
        <span class="line rise accent-line" style="--i:2"><span class="nb">การวิจัยทางสุขภาพ</span><span class="nb">กับการกำหนดนโยบาย</span></span>
      </h1>
      <p class="muted rise" style="--i:3">ผู้เล่นสแกน QR จากจอหลักแล้วใส่ชื่อเพื่อร่วมตอบ</p>
      <div class="links rise" style="--i:4">
        <a class="btn big" href="/play">เข้าร่วมเกม</a>
        <a class="btn ghost big" href="/admin">สำหรับผู้ดูแล</a>
      </div>
    </div>
    <div class="card demo rise" style="--i:3" aria-hidden="true">
      <div class="cloud" id="demoCloud"></div>
      <div class="demo-count" id="demoCount" aria-hidden="true"></div>
    </div>
  </main>
</div>
<script type="module">
  import { WordCloud } from "/js/cloud.js";
  const WORDS = [
    ["หลักฐานเชิงประจักษ์", 9], ["นโยบายสาธารณะ", 8], ["การวิจัย", 8], ["ข้อมูล", 6], ["ผู้กำหนดนโยบาย", 5],
    ["การนำผลวิจัยไปใช้", 5], ["การมีส่วนร่วม", 4], ["ความโปร่งใส", 4], ["ผลกระทบ", 4], ["ความเท่าเทียม", 3],
    ["งบประมาณ", 3], ["จริยธรรม", 3], ["ความคุ้มค่า", 2], ["การสื่อสาร", 3], ["ความร่วมมือ", 3], ["AI", 2],
  ];
  const bag = WORDS.flatMap(([w, n]) => Array(n).fill(w));
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const el = document.getElementById("demoCloud");
  const countEl = document.getElementById("demoCount");
  const cloud = new WordCloud(el);
  cloud.setEmptyText("");
  let counts = new Map();
  let votes = 0;
  const show = () => {
    cloud.update([...counts].map(([text, count]) => ({ text, count })));
    countEl.textContent = `${votes} คำตอบ`;
  };
  const vote = () => {
    const w = bag[Math.floor(Math.random() * bag.length)];
    counts.set(w, (counts.get(w) || 0) + 1);
    votes++;
    show();
  };
  // Start already filled so the first frame shows what the product does.
  for (let i = 0; i < 18; i++) vote();
  if (!reduce) {
    setInterval(() => {
      if (votes >= 60) {
        counts = new Map();
        votes = 0;
        show();
        return;
      }
      vote();
    }, 1400);
  }
</script>
</body>
</html>
